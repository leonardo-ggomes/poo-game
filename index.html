<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KotlinQuest Arena — Top-Down</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b14;--panel:#0e1120;--panel2:#131728;--border:#1e2440;
  --accent:#e8c84a;--a2:#ff5f5f;--a3:#5fffb0;--a4:#5faaff;
  --text:#c8d0f0;--dim:#505878;--code:#07090f;
  --s1:#ff8c42;--s2:#5faaff;--s3:#5fffb0;--s4:#ff5f5f;--s5:#e8c84a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Fira Code',monospace;font-size:13px}
#app{display:grid;grid-template-columns:400px 1fr;height:100vh}
#left{display:flex;flex-direction:column;border-right:2px solid var(--border);overflow:hidden;background:var(--panel)}
#right{display:flex;flex-direction:column;overflow:hidden;position:relative}
#lh{padding:13px 16px 11px;background:#090c18;border-bottom:2px solid var(--border);flex-shrink:0}
.logo{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--accent);letter-spacing:1px}
.logo em{color:var(--a3);font-style:normal}
.logosub{font-family:'VT323',monospace;font-size:15px;color:var(--dim);margin-top:2px}
#pills{display:flex;gap:4px;padding:9px 14px 8px;border-bottom:2px solid var(--border);flex-shrink:0;overflow-x:auto}
#pills::-webkit-scrollbar{height:0}
.pill{height:28px;padding:0 10px;border-radius:14px;border:1.5px solid var(--border);font-family:'Press Start 2P',monospace;font-size:6px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:all .2s;white-space:nowrap;color:var(--dim);background:var(--panel2);flex-shrink:0}
.pill .pnum{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6px;background:#ffffff10}
.pill.active{border-color:var(--accent);color:var(--accent);background:#e8c84a14}
.pill.active .pnum{background:var(--accent);color:#000}
.pill.done{border-color:var(--a3);color:var(--a3);background:#5fffb012}
.pill.done .pnum{background:var(--a3);color:#000}
.pill.locked{opacity:.35;cursor:not-allowed}
#guide{flex:1;overflow-y:auto;padding:14px 14px 20px}
#guide::-webkit-scrollbar{width:3px}
#guide::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.story{background:linear-gradient(135deg,#0a0d1c,#141030);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:10px 13px;margin-bottom:12px;font-family:'VT323',monospace;font-size:17px;color:#aab8d8;line-height:1.55}
.story b{color:var(--accent)}
.story code{color:var(--a3);background:#ffffff0d;padding:1px 5px;border-radius:3px;font-size:14px}
.poo-banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;margin-bottom:11px;font-family:'Press Start 2P',monospace;font-size:7px}
.write-block{background:var(--code);border:1.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.wb-header{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:#ffffff05}
.wb-header span{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);flex:1}
.wb-type{padding:2px 8px;border-radius:10px;font-family:'Press Start 2P',monospace;font-size:5px}
.wb-body{padding:12px 14px;font-family:'Fira Code',monospace;font-size:12.5px;line-height:1.75;overflow-x:auto}
.kw{color:#ff79c6}.cls{color:#8be9fd}.fn{color:#50fa7b}
.str{color:#f1fa8c}.num{color:#bd93f9}.cmnt{color:#485475;font-style:italic}
.prop{color:#ffb86c}.hl{background:#f7c94818;border-radius:3px;padding:0 3px}
.annot{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;background:#ffffff06;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;font-size:12px;color:var(--dim);line-height:1.6}
.annot .ai{font-size:15px;flex-shrink:0;margin-top:1px}
.annot b{color:var(--text)}
.annot code{color:var(--a3);background:#ffffff0d;padding:1px 4px;border-radius:3px}
.chips-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;font-size:11px;color:var(--dim);transition:all .18s;white-space:nowrap}
.chip:hover{border-color:var(--a3);color:var(--a3);transform:translateY(-1px)}
.custom-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:10px}
.custom-title{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);margin-bottom:9px}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.crow label{font-size:11px;color:var(--dim);width:76px;flex-shrink:0}
.crow input[type=range]{flex:1;accent-color:var(--accent);height:4px}
.crow .cv{font-family:'VT323',monospace;font-size:17px;color:var(--accent);width:34px;text-align:right}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:20px;height:20px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.sw:hover{transform:scale(1.25)}.sw.on{border-color:#fff}
.ed-wrap{margin-bottom:9px}
.ed-top{display:flex;align-items:center;gap:5px;padding:6px 10px;background:var(--code);border:1.5px solid var(--border);border-radius:7px 7px 0 0;border-bottom:none}
.ed-top .fn-name{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--a4);flex:1}
.ed-btn{font-family:'Press Start 2P',monospace;font-size:5px;padding:3px 7px;border-radius:4px;border:1px solid var(--border);background:none;color:var(--dim);cursor:pointer;transition:all .15s}
.ed-btn:hover{border-color:var(--accent);color:var(--accent)}
textarea#ced{width:100%;min-height:200px;max-height:280px;background:var(--code);border:1.5px solid var(--border);border-radius:0 0 7px 7px;color:#cdd6f4;font-family:'Fira Code',monospace;font-size:12.5px;line-height:1.75;padding:12px 14px;resize:vertical;outline:none;tab-size:2}
textarea#ced:focus{border-color:var(--a4)}
textarea#ced.err{border-color:var(--a2)!important;animation:shake .3s}
textarea#ced.ok{border-color:var(--a3)!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fb{margin-bottom:9px;border-radius:6px;padding:9px 12px;display:none;font-family:'VT323',monospace;font-size:16px;line-height:1.55}
#fb.err{background:#200a0a;border:1px solid var(--a2);color:var(--a2)}
#fb.ok{background:#0a1e14;border:1px solid var(--a3);color:var(--a3)}
#fb.warn{background:#1a1600;border:1px solid var(--accent);color:var(--accent)}
#bsub{width:100%;padding:11px;font-family:'Press Start 2P',monospace;font-size:7px;background:var(--accent);color:#000;border:none;border-radius:7px;cursor:pointer;transition:all .2s;letter-spacing:.5px;margin-bottom:10px}
#bsub:hover{box-shadow:0 4px 18px #e8c84a44;transform:translateY(-2px)}
#bsub:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
#pchecks{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:10px 13px;margin-bottom:10px}
.pct{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);margin-bottom:8px}
.pc{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;color:var(--dim);transition:color .3s}
.pc.on{color:var(--a3)}
.pc .pd{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:all .3s}
.pc.on .pd{background:var(--a3);box-shadow:0 0 6px #5fffb060}
#gh{padding:9px 14px;background:#090c18;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.gh-logo{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--a3)}
#cwrap{flex:1;position:relative;overflow:hidden}
canvas#wc{display:block;width:100%;height:100%;image-rendering:pixelated}
#hpc{position:absolute;top:10px;left:10px;background:#000000b8;border:1px solid var(--border);border-radius:9px;padding:9px 13px;min-width:190px;backdrop-filter:blur(4px)}
.hn{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--accent);margin-bottom:6px}
.hbw{margin-bottom:5px}
.hbl{font-family:'VT323',monospace;font-size:13px;color:var(--dim);margin-bottom:2px}
.hbt{height:8px;background:#ffffff12;border-radius:99px;overflow:hidden;border:1px solid #ffffff15}
.hbf{height:100%;border-radius:99px;transition:width .4s}
.hpf{background:linear-gradient(90deg,#cc2222,#ff8822)}
.xpf{background:linear-gradient(90deg,var(--a3),var(--accent))}
#pls{position:absolute;top:10px;right:10px;background:#000000b8;border:1px solid var(--border);border-radius:9px;padding:8px 11px;min-width:145px;backdrop-filter:blur(4px)}
.plt{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);margin-bottom:7px}
.pli{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-family:'VT323',monospace;font-size:15px}
.pld{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.plx{margin-left:auto;font-size:12px;color:var(--accent)}
#spb{position:absolute;bottom:56px;right:10px;background:#000000b8;border:1px solid var(--border);border-radius:9px;padding:7px 11px;backdrop-filter:blur(4px);font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);text-align:right}
#spb .spv{color:var(--accent);font-size:8px;display:block;margin-top:3px}
#ctrl{position:absolute;bottom:10px;left:10px;background:#000000b8;border:1px solid var(--border);border-radius:9px;padding:8px 12px;backdrop-filter:blur(4px);display:flex;gap:10px;align-items:center}
.ck{width:26px;height:26px;background:#ffffff12;border:1px solid #ffffff25;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:6px;color:var(--text);transition:background .1s}
.ck.on{background:var(--accent);color:#000}
.kgroup{display:flex;flex-direction:column;align-items:center;gap:2px}
.krow{display:flex;gap:2px}
.kl{font-family:'Press Start 2P',monospace;font-size:5px;color:var(--dim);margin-top:3px}
#acts{position:absolute;bottom:10px;right:10px;display:flex;gap:7px;pointer-events:all}
.abtn{background:#000000b8;border:1.5px solid var(--border);border-radius:9px;padding:8px 13px;cursor:pointer;text-align:center;transition:all .18s;font-family:'Press Start 2P',monospace;backdrop-filter:blur(4px)}
.abtn:hover:not([disabled]){transform:translateY(-3px)}
.abtn[disabled]{opacity:.35;cursor:not-allowed}
.ak{font-size:5px;color:var(--dim);margin-bottom:4px}
.ai2{font-size:18px;display:block;margin-bottom:3px}
.an{font-size:5px;color:var(--text)}
#ba{border-color:var(--a2)}
#be{border-color:var(--a4)}
#feed{position:absolute;top:70px;right:10px;display:flex;flex-direction:column;gap:3px;max-width:230px}
.fi{background:#000000b0;border:1px solid var(--border);border-radius:5px;padding:5px 9px;font-family:'VT323',monospace;font-size:14px;animation:fi .25s ease;backdrop-filter:blur(4px)}
@keyframes fi{from{opacity:0;transform:translateX(16px)}to{opacity:1}}
.fk{color:var(--a2)}.fx{color:var(--a3)}.fo{color:var(--a4)}.fa{color:var(--accent)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,#e8c84a22 0%,transparent 65%)}
#flash.on{animation:flashp .7s ease}
@keyframes flashp{0%,100%{opacity:0}40%{opacity:1}}
#mmap{position:absolute;bottom:56px;left:10px;width:110px;height:110px;border:1px solid var(--border);border-radius:7px;overflow:hidden;background:#000000b8}
#mmap canvas{width:100%;height:100%}
#nm{position:fixed;inset:0;background:#000000cc;display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(8px)}
#nmb{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:34px;text-align:center;max-width:380px;width:92%;box-shadow:0 0 80px #e8c84a1e}
.nmt{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--accent);margin-bottom:6px;line-height:1.6}
.nms{font-family:'VT323',monospace;font-size:17px;color:var(--dim);margin-bottom:20px}
#nmi{width:100%;background:var(--code);border:2px solid var(--border);border-radius:7px;padding:10px 14px;color:var(--text);font-family:'VT323',monospace;font-size:22px;outline:none;margin-bottom:14px;text-align:center}
#nmi:focus{border-color:var(--accent)}
#ngo{width:100%;padding:13px;font-family:'Press Start 2P',monospace;font-size:8px;background:var(--accent);color:#000;border:none;border-radius:7px;cursor:pointer}
.xpn{position:absolute;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--accent);pointer-events:none;text-shadow:1px 1px 0 #000;animation:dn 1.5s ease forwards;z-index:50}
.dmgn{position:absolute;font-family:'Press Start 2P',monospace;font-size:8px;color:var(--a2);pointer-events:none;text-shadow:1px 1px 0 #000;animation:dn 1.2s ease forwards;z-index:50}
@keyframes dn{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
</style>
</head>
<body>
<div id="nm"><div id="nmb">
  <div class="nmt">⚔️ KOTLIN<br>QUEST ARENA</div>
  <div class="nms">// Mundo top-down — Perlin Noise</div>
  <input id="nmi" placeholder="Seu nome de jogador..." maxlength="14">
  <button id="ngo" onclick="enterArena()">▶ ENTRAR NO REINO</button>
</div></div>

<div id="app">
<div id="left">
  <div id="lh">
    <div class="logo">⚔️ Kotlin<em>Quest</em> Arena</div>
    <div class="logosub">// Guia passo-a-passo de POO em Kotlin</div>
  </div>
  <div id="pills"></div>
  <div id="guide"></div>
</div>
<div id="right">
  <div id="gh">
    <div class="gh-logo">🗺️ REINO KOTLINIA</div>
    <span style="font-family:'VT323',monospace;font-size:15px;color:var(--dim)">👥 <span id="oc">0</span></span>
    <div style="flex:1"></div>
    <span id="cst" style="font-family:'VT323',monospace;font-size:14px;color:var(--dim)">⚫ Conectando...</span>
  </div>
  <div id="cwrap">
    <canvas id="wc"></canvas>
    <div id="hpc">
      <div class="hn" id="hpn">— Sem personagem —</div>
      <div class="hbw"><div class="hbl">❤️ HP: <span id="hhv">—</span></div><div class="hbt"><div class="hbf hpf" id="hhb" style="width:100%"></div></div></div>
      <div class="hbw"><div class="hbl">⭐ XP: <span id="hxv">0</span> | Nv <span id="hlv">1</span></div><div class="hbt"><div class="hbf xpf" id="hxb" style="width:0%"></div></div></div>
      <div class="hbl" style="margin-top:4px">📖 Passo: <span id="hst" style="color:var(--accent)">0/5</span></div>
    </div>
    <div id="pls"><div class="plt">👥 HERÓIS</div><div id="pli"></div></div>
    <div id="spb">PROGRESSO POO<span class="spv" id="spv">░░░░░</span></div>
    <div id="mmap"><canvas id="mm"></canvas></div>
    <div id="ctrl">
      <div class="kgroup">
        <div class="ck" id="kw">W</div>
        <div class="krow"><div class="ck" id="ka">A</div><div class="ck" id="ks">S</div><div class="ck" id="kd">D</div></div>
        <div class="kl">MOVER</div>
      </div>
      <div class="kgroup">
        <div class="ck" style="width:44px" id="ksp">SPC</div>
        <div class="kl">ATACAR</div>
      </div>
    </div>
    <div id="acts">
      <div class="abtn" id="ba" disabled onclick="doAttack()"><div class="ak">[SPACE]</div><span class="ai2">⚔️</span><div class="an">ATACAR</div></div>
      <div class="abtn" id="be" disabled onclick="doEmote()"><div class="ak">[E]</div><span class="ai2">💬</span><div class="an">EMOTE</div></div>
    </div>
    <div id="feed"></div>
    <div id="flash"></div>
  </div>
</div>
</div>

<script>
/* ── PERLIN NOISE ─────────────────────────────────────────── */
const Perlin=(()=>{
  const p=new Uint8Array(512),pp=new Uint8Array(256);
  for(let i=0;i<256;i++) pp[i]=i;
  for(let i=255;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pp[i],pp[j]]=[pp[j],pp[i]];}
  for(let i=0;i<512;i++) p[i]=pp[i&255];
  const f=t=>t*t*t*(t*(t*6-15)+10);
  const l=(a,b,t)=>a+(b-a)*t;
  const g=(h,x,y)=>{const H=h&3,u=H<2?x:y,v=H<2?y:x;return((H&1)?-u:u)+((H&2)?-v:v);};
  return{noise(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255;
    x-=Math.floor(x);y-=Math.floor(y);
    const u=f(x),v=f(y),A=p[X]+Y,B=p[X+1]+Y;
    return l(l(g(p[A],x,y),g(p[B],x-1,y),u),l(g(p[A+1],x,y-1),g(p[B+1],x-1,y-1),u),v);
  }};
})();
function octave(x,y,o=4,ps=0.55,lc=2){
  let v=0,a=1,fr=1,mx=0;
  for(let i=0;i<o;i++){v+=Perlin.noise(x*fr,y*fr)*a;mx+=a;a*=ps;fr*=lc;}
  return v/mx;
}

/* ── WORLD CONFIG ─────────────────────────────────────────── */
const TW=120,TH=120,TS=16,WPX=TW*TS,WPY=TH*TS;
const T={DEEP:0,WATER:1,SAND:2,GRASS:3,DGRASS:4,STONE:5,DIRT:6,ROAD:9,CFLOOR:8,CWALL:11};
const TC={0:'#0d2240',1:'#1a4060',2:'#c8a060',3:'#3a7030',4:'#2a5822',5:'#606060',6:'#8a5a30',9:'#7a6040',8:'#7a7068',11:'#4a4040'};

let tileMap=null,decorMap=null,offC=null,offX=null;

function solid(tx,ty){
  if(tx<0||ty<0||tx>=TW||ty>=TH) return true;
  const t=tileMap[ty*TW+tx];
  return t===T.DEEP||t===T.WATER||t===T.CWALL||decorMap[ty*TW+tx]==='tree'||decorMap[ty*TW+tx]==='wall';
}

function generateWorld(){
  tileMap=new Uint8Array(TW*TH);
  decorMap=new Array(TW*TH).fill(null);
  for(let y=0;y<TH;y++) for(let x=0;x<TW;x++){
    const n=octave(x/28,y/28,5,0.55,2);
    const m=octave(x/14+100,y/14+100,3,0.5,2)*0.3;
    const h=(n+m+1)/2;
    let t;
    if(h<0.32) t=T.DEEP;
    else if(h<0.40) t=T.WATER;
    else if(h<0.44) t=T.SAND;
    else if(h<0.56) t=T.GRASS;
    else if(h<0.68) t=T.DGRASS;
    else t=T.STONE;
    tileMap[y*TW+x]=t;
  }
  // Roads
  const ry=Math.floor(TH/2),rx=Math.floor(TW/2);
  for(let x=0;x<TW;x++){setRoad(x,ry);setRoad(x,ry+1);}
  for(let y=0;y<TH;y++){setRoad(rx,y);setRoad(rx+1,y);}
  // Castle
  const cx=rx-8,cy=ry-8;
  for(let dy=-10;dy<=10;dy++) for(let dx=-12;dx<=12;dx++){
    const tx=cx+dx,ty=cy+dy;
    if(tx<0||ty<0||tx>=TW||ty>=TH) continue;
    tileMap[ty*TW+tx]=(Math.abs(dx)>=11||Math.abs(dy)>=9)?T.CWALL:T.CFLOOR;
    decorMap[ty*TW+tx]=null;
  }
  // Decorations
  for(let y=1;y<TH-1;y++) for(let x=1;x<TW-1;x++){
    const t=tileMap[y*TW+x],r=Perlin.noise(x*0.7+50,y*0.7+50);
    if(t===T.DGRASS&&r>0.28) decorMap[y*TW+x]='tree';
    else if(t===T.GRASS&&r>0.58) decorMap[y*TW+x]=r>0.68?'bush':'flower';
    else if(t===T.STONE&&r>0.42) decorMap[y*TW+x]='rock';
    else if(t===T.SAND&&r>0.58) decorMap[y*TW+x]='shrub';
    else if(t===T.CFLOOR&&r>0.72&&Math.abs(x-cx)>3&&Math.abs(y-cy)>3) decorMap[y*TW+x]='barrel';
  }
  // Torches at castle gate
  [[cx-4,cy+9],[cx,cy+9],[cx+4,cy+9],[cx-4,cy-9],[cx,cy-9],[cx+4,cy-9]].forEach(([tx,ty])=>{
    if(tx>=0&&ty>=0&&tx<TW&&ty<TH){decorMap[ty*TW+tx]='torch';}
  });
  // Well center
  if(cx>=0&&cy>=0) decorMap[cy*TW+cx]='well';
  // Villages
  [[25,25],[TW-30,25],[25,TH-30]].forEach(([vx,vy])=>buildVillage(vx,vy,rx,ry));
  bakeOffscreen();
}

function setRoad(x,y){
  if(x<0||y<0||x>=TW||y>=TH) return;
  const t=tileMap[y*TW+x];
  if(t>=T.GRASS&&t!==T.CFLOOR&&t!==T.CWALL){tileMap[y*TW+x]=T.ROAD;decorMap[y*TW+x]=null;}
}

function buildVillage(cx,cy,rx,ry){
  for(let dy=-5;dy<=5;dy++) for(let dx=-5;dx<=5;dx++){
    const tx=cx+dx,ty=cy+dy;
    if(tx<2||ty<2||tx>=TW-2||ty>=TH-2) continue;
    tileMap[ty*TW+tx]=T.DIRT;decorMap[ty*TW+tx]=null;
  }
  [[-3,-3],[3,-3],[0,3]].forEach(([dx,dy])=>{
    const tx=cx+dx,ty=cy+dy;
    if(tx>=0&&ty>=0&&tx<TW&&ty<TH) decorMap[ty*TW+tx]='hut';
  });
  if(cx>=0&&cy>=0) decorMap[cy*TW+cx]='well';
  let bx=cx,by=cy;
  while(bx!==rx){setRoad(bx,by);bx+=bx<rx?1:-1;}
  while(by!==ry){setRoad(bx,by);by+=by<ry?1:-1;}
}

function bakeOffscreen(){
  offC=document.createElement('canvas');
  offC.width=WPX;offC.height=WPY;
  offX=offC.getContext('2d');
  for(let y=0;y<TH;y++) for(let x=0;x<TW;x++){
    const t=tileMap[y*TW+x],px=x*TS,py=y*TS;
    offX.fillStyle=TC[t]||'#333';offX.fillRect(px,py,TS,TS);
    tileDetail(offX,t,px,py,x,y);
    const d=decorMap[y*TW+x];
    if(d) drawDecor(offX,d,px,py);
  }
}

function tileDetail(c,t,px,py,tx,ty){
  const s=tx*1000+ty;
  if(t===T.GRASS||t===T.DGRASS){
    c.fillStyle=t===T.GRASS?'#2a6020':'#1e4a18';
    for(let i=0;i<3;i++){c.fillRect(px+((s*3+i*7)%13),py+((s*7+i*5)%12),1,2);}
  }
  if(t===T.WATER||t===T.DEEP){
    c.fillStyle=t===T.WATER?'#1e5070':'#0a1a30';
    c.fillRect(px+2,py+6,TS-4,1);c.fillRect(px+4,py+12,TS-6,1);
  }
  if(t===T.STONE){
    c.fillStyle='#505050';c.fillRect(px,py,TS/2,TS/2);c.fillRect(px+TS/2,py+TS/2,TS/2,TS/2);
    c.fillStyle='#6a6a6a';c.fillRect(px+TS/2,py,TS/2,TS/2);c.fillRect(px,py+TS/2,TS/2,TS/2);
  }
  if(t===T.ROAD){c.fillStyle='#6a5030';for(let i=0;i<4;i++) c.fillRect(px+(s+i*4)%14,py+(s*3+i)%14,1,1);}
  if(t===T.CFLOOR){
    c.fillStyle='#6a6058';c.fillRect(px,py,TS/2,TS/2);c.fillRect(px+TS/2,py+TS/2,TS/2,TS/2);
    c.fillStyle='#7a7068';c.fillRect(px+TS/2,py,TS/2,TS/2);c.fillRect(px,py+TS/2,TS/2,TS/2);
  }
  if(t===T.CWALL){
    c.fillStyle='#3a3030';c.fillRect(px+2,py+2,TS-4,TS-4);
    c.fillStyle='#555050';c.fillRect(px,py,TS,4);c.fillRect(px,py,4,TS);
  }
  if(t===T.DIRT){c.fillStyle='#7a4a22';for(let i=0;i<4;i++) c.fillRect(px+(s*5+i*3)%14,py+(s+i*6)%14,1,1);}
  if(t===T.SAND){c.fillStyle='#b89050';for(let i=0;i<5;i++) c.fillRect(px+(s*5+i*3)%14,py+(s+i*6)%14,1,1);}
}

function drawDecor(c,d,px,py){
  switch(d){
    case'tree':
      c.fillStyle='#1a3010';c.fillRect(px,py,TS,TS);
      c.fillStyle='#2a5020';c.fillRect(px+2,py+2,TS-4,TS-4);
      c.fillStyle='#3a6828';c.fillRect(px+4,py+4,TS-8,TS-8);
      c.fillStyle='#5a3a10';c.fillRect(px+6,py+7,4,5);
      break;
    case'bush':
      c.fillStyle='#2a5a18';c.fillRect(px+2,py+5,TS-4,TS-7);
      c.fillStyle='#3a7020';c.fillRect(px+4,py+4,TS-8,TS-6);break;
    case'flower':
      c.fillStyle='#e8d050';c.fillRect(px+6,py+6,4,4);
      c.fillStyle='#e04040';c.fillRect(px+4,py+4,3,3);break;
    case'rock':
      c.fillStyle='#484848';c.fillRect(px+3,py+5,10,8);
      c.fillStyle='#606060';c.fillRect(px+4,py+4,8,6);
      c.fillStyle='#707070';c.fillRect(px+5,py+5,4,3);break;
    case'shrub':
      c.fillStyle='#907040';c.fillRect(px+4,py+8,8,5);
      c.fillStyle='#b09050';c.fillRect(px+5,py+6,6,5);break;
    case'torch':
      c.fillStyle='#6a3a10';c.fillRect(px+6,py+4,4,10);
      c.fillStyle='#ffcc00';c.fillRect(px+5,py+2,6,5);
      c.fillStyle='#ff8800';c.fillRect(px+6,py+3,4,3);
      c.fillStyle='#ffff80';c.fillRect(px+7,py+2,2,2);break;
    case'barrel':
      c.fillStyle='#7a4a20';c.fillRect(px+3,py+4,10,9);
      c.fillStyle='#5a3010';c.fillRect(px+3,py+6,10,2);c.fillRect(px+3,py+9,10,2);
      c.fillStyle='#9a6030';c.fillRect(px+4,py+5,8,7);break;
    case'well':
      c.fillStyle='#5a4a30';c.fillRect(px+2,py+6,12,8);
      c.fillStyle='#3a2a18';c.fillRect(px+4,py+8,8,6);
      c.fillStyle='#1a4060';c.fillRect(px+5,py+9,6,5);
      c.fillStyle='#7a5a30';c.fillRect(px+1,py+5,14,3);
      c.fillStyle='#6a4a20';c.fillRect(px+2,py+2,3,5);c.fillRect(px+11,py+2,3,5);
      c.fillStyle='#8a6a40';c.fillRect(px+2,py+2,12,3);break;
    case'hut':
      c.fillStyle='#5a3a10';c.fillRect(px+1,py+5,14,11);
      c.fillStyle='#7a2010';c.fillRect(px+0,py+3,16,5);
      c.fillStyle='#5a1808';c.fillRect(px+1,py+4,14,4);
      c.fillStyle='#2a1808';c.fillRect(px+5,py+10,6,6);
      c.fillStyle='#c8a060';c.fillRect(px+7,py+7,2,3);break;
  }
}

function drawMinimap(){
  if(!tileMap) return;

  for(let i=0;i<TW*TH;i++){
    const c=COL[tileMap[i]]||[80,80,80];
    id.data[i*4]=c[0];id.data[i*4+1]=c[1];id.data[i*4+2]=c[2];id.data[i*4+3]=255;
  }
  mmX.putImageData(id,0,0);
  Object.values(players).forEach(p=>{
    const mx=Math.floor(p.x/TS),my=Math.floor(p.y/TS);
    mmX.fillStyle=p.id===myId?'#e8c84a':'#ff5f5f';

}

    .map(c=>`<div class="sw" style="background:${c}" onclick="insertColor('${c}',this)" title="${c}"></div>`).join('');
  const chips=s.chips.map(c=>`<div class="chip" onclick="insertChip(${JSON.stringify(c.c)})">${c.l}</div>`).join('');
  const blocks=s.blocks.map(b=>{
    const isW=b.type==='write';
    return `<div class="write-block">
<div class="wb-header"><span>${b.label}</span>
<span class="wb-type" style="background:${isW?s.color+'22':'#ffffff10'};color:${isW?s.color:'var(--dim)'};border:1px solid ${isW?s.color+'60':'var(--border)'}">
${isW?'✏️ VOCÊ ESCREVE':'ℹ️ INFO'}</span></div>
<div class="wb-body">${b.lines.map(l=>`<div style="min-height:1.75em">${l||'&nbsp;'}</div>`).join('')}</div>
</div>`;}).join('');

  const custom=n>=1?`<div class="custom-box">
<div class="custom-title">🎨 PERSONALIZADOR — ajuste e veja no editor</div>
<div class="crow"><label>Cor:</label><div class="swatches">${swatches}</div></div>
<div class="crow"><label>forca</label><input type="range" min="5" max="80" value="30" oninput="setA('forca',this.value,this)"><span class="cv" id="cv-forca">30</span></div>
<div class="crow"><label>defesa</label><input type="range" min="0" max="80" value="20" oninput="setA('defesa',this.value,this)"><span class="cv" id="cv-defesa">20</span></div>
<div class="crow"><label>velocidade</label><input type="range" min="1" max="8" value="4" oninput="setA('velocidade',this.value,this)"><span class="cv" id="cv-velocidade">4</span></div>
<div class="crow"><label>hp</label><input type="range" min="40" max="200" value="100" oninput="setA('hp',this.value,this)"><span class="cv" id="cv-hp">100</span></div>
</div>`:'';

  document.getElementById('guide').innerHTML=`
<div class="poo-banner" style="background:${s.color}14;border:1px solid ${s.color}40">
<span style="font-size:16px">${s.poo.split(' ')[0]}</span>
<span style="color:${s.color}">${s.poo.slice(s.poo.indexOf(' ')+1)}</span>
</div>
<div class="story">${s.story}</div>
<div class="annot"><span class="ai">📖</span><div>${s.explain}</div></div>
${blocks}${custom}
<div class="chips-row">${chips}</div>
<div class="ed-wrap">
<div class="ed-top"><span class="fn-name">// MeuPersonagem.kt — Ctrl+Enter para validar</span>
<button class="ed-btn" onclick="setTpl()">↺ template</button>
<button class="ed-btn" onclick="showHint()">💡 dica</button></div>
<textarea id="ced" spellcheck="false" onkeydown="edKey(event)">${s.template}</textarea>
</div>
<div id="fb"></div>
<button id="bsub" onclick="submitCode()">▶ VALIDAR CÓDIGO &amp; ENTRAR NO REINO (+${s.xp} XP)</button>
<div id="pchecks">
<div class="pct">✅ PRINCÍPIOS POO DETECTADOS AUTOMATICAMENTE</div>
<div class="pc" id="pc0"><div class="pd"></div>Herança → class X : Personagem(nome)</div>
<div class="pc" id="pc1"><div class="pd"></div>Encapsulamento → val/var com tipos</div>
<div class="pc" id="pc2"><div class="pd"></div>Encapsulamento privado → private var</div>
<div class="pc" id="pc3"><div class="pd"></div>Polimorfismo → override fun mover()</div>
<div class="pc" id="pc4"><div class="pd"></div>Polimorfismo → override fun atacar()</div>
<div class="pc" id="pc5"><div class="pd"></div>Interface → Aventureiro implementada</div>
</div>
<div style="padding:9px 12px;background:${s.color}0e;border:1px solid ${s.color}30;border-radius:7px;margin-top:4px">
<div style="font-family:'Press Start 2P',monospace;font-size:6px;color:${s.color};margin-bottom:4px">🎮 AO COMPLETAR ESTE PASSO</div>
<div style="font-size:12px;color:var(--dim)">${s.result}</div></div>`;
}

function renderPills(){
  const max=myPlayer?myPlayer.step:0;
  document.getElementById('pills').innerHTML=STEPS.map(s=>{
    const done=s.n<max,active=s.n===currentStep,locked=s.n>max&&s.n!==0;
    return`<div class="pill ${done?'done':active?'active':locked?'locked':''}" onclick="goStep(${s.n})"><div class="pnum">${done?'✓':s.n+1}</div>${s.label}</div>`;
  }).join('');
}

/* ── STATE ────────────────────────────────────────────────── */
let socket,myId,myPlayer,playerName='';
let currentStep=0,players={},keys={};
let lastMove=0,atkCD=false;
let canvas2,ctx2,CW,CH,camX=0,camY=0;
let particles=[],emotes=[],dmgNums=[];

/* ── BOOT ─────────────────────────────────────────────────── */
window.onload=()=>{
  generateWorld();
  canvas2=document.getElementById('wc');
  ctx2=canvas2.getContext('2d');
  resize();window.addEventListener('resize',resize);
  renderStep(0);renderPills();
  requestAnimationFrame(loop);
};
function resize(){
  const w=document.getElementById('cwrap');
  canvas2.width=w.clientWidth;canvas2.height=w.clientHeight;
  CW=canvas2.width;CH=canvas2.height;
}
function enterArena(){
  playerName=document.getElementById('nmi').value.trim()||'Herói';
  document.getElementById('nm').style.display='none';
  connect();
}
document.getElementById('nmi').addEventListener('keydown',e=>{if(e.key==='Enter')enterArena();});

/* ── SOCKET ───────────────────────────────────────────────── */
function connect(){
  socket=io('http://10.111.9.14:3000');
  socket.on('connect',()=>{myId=socket.id;setCST('🟢 Conectado','var(--a3)');});
  socket.on('disconnect',()=>setCST('🔴 Desconectado','var(--a2)'));
  socket.on('init',({players:ps})=>{players=ps;updateOL();updatePL();});
  socket.on('player_update',p=>{players[p.id]=p;if(p.id===myId){myPlayer=p;updateHUD();}updatePL();});
  socket.on('player_moved',({id,x,y,facing})=>{if(players[id]){players[id].x=x;players[id].y=y;players[id].facing=facing;}});
  socket.on('player_left',id=>{delete players[id];updateOL();updatePL();});
  socket.on('code_ok',({validation,player,newSteps,xpGained})=>{
    myPlayer=player;players[myId]=player;updateHUD();updatePL();
    const ns=validation.step;
    currentStep=Math.max(currentStep,Math.min(ns,4));
    renderPills();updatePooChecks(validation.pooChecks||{});
    showFB('ok',`✅ Código válido! Passo ${ns}/5.${xpGained?' +'+xpGained+' XP!':''}`);
    if(ns>=3){setDis('ba',false);setDis('be',false);}
    if(newSteps.length){flashEl();showXPN(xpGained);}
    updateStepBadge();
  });
  socket.on('code_error',({errors,pooChecks})=>{
    showFB('err',errors[0]||'Erro no código!');updatePooChecks(pooChecks||{});
    const t=document.getElementById('ced');if(t){t.classList.add('err');setTimeout(()=>t.classList.remove('err'),600);}
  });
  socket.on('attack_event',({attackerId,hits,x,y,facing})=>{
    spawnFx(x,y,facing);
    hits.forEach(h=>{if(!players[h.targetId])return;dmgNums.push({x:players[h.targetId].x,y:players[h.targetId].y,val:h.dmg,t:70});if(h.killed)players[h.targetId].alive=false;});
  });
  socket.on('player_died',({id,killedBy})=>{if(players[id])players[id].alive=false;addFeed(`⚔️ ${players[killedBy]?.name||'?'} → ${players[id]?.name||'?'}`,'fk');if(killedBy===myId)addFeed('+40 XP!','fx');});
  socket.on('player_respawn',p=>{players[p.id]=p;if(p.id===myId){myPlayer=p;updateHUD();}addFeed(`💫 ${p.name} ressurgiu`,'fo');});
  socket.on('took_damage',({from,dmg})=>addFeed(`💥 -${dmg} HP de ${from}`,'fk'));
  socket.on('emote_event',({id,name,msg})=>{if(players[id])emotes.push({id,msg,t:150});addFeed(`💬 ${name}: ${msg}`,'fo');});
  socket.on('achievement',({name,xpGained})=>addFeed(`🏆 ${name} +${xpGained}XP`,'fa'));
}

/* ── INPUT ────────────────────────────────────────────────── */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA') return;
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){e.preventDefault();doAttack();}
  if(e.key.toLowerCase()==='e') doEmote();
  const m={w:'kw',a:'ka',s:'ks',d:'kd',' ':'ksp'};
  if(m[e.key.toLowerCase()]) document.getElementById(m[e.key.toLowerCase()])?.classList.add('on');
});
document.addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
  const m={w:'kw',a:'ka',s:'ks',d:'kd',' ':'ksp'};
  if(m[e.key.toLowerCase()]) document.getElementById(m[e.key.toLowerCase()])?.classList.remove('on');
});
function doAttack(){if(!socket||!myPlayer||myPlayer.step<4||atkCD||!myPlayer.alive) return;atkCD=true;socket.emit('attack');setTimeout(()=>atkCD=false,700);}
function doEmote(){if(!socket||!myPlayer) return;const es=['Olá! 👋','WASD para mover!','⚔️ Cuidado!','POO é incrível! 🚀'];socket.emit('emote',{msg:es[Math.floor(Math.random()*es.length)]});}

/* ── LOOP ─────────────────────────────────────────────────── */
function loop(){handleMove();render();requestAnimationFrame(loop);}
function handleMove(){
  if(!socket||!myPlayer||myPlayer.step<3||!myPlayer.alive) return;
  const now=Date.now();if(now-lastMove<50) return;lastMove=now;
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup']) dy=-1;if(keys['s']||keys['arrowdown']) dy=1;
  if(keys['a']||keys['arrowleft']) dx=-1;if(keys['d']||keys['arrowright']) dx=1;
  if(dx||dy) socket.emit('move',{dx,dy});
}

/* ── RENDER ───────────────────────────────────────────────── */
function render(){
  if(!ctx2||!offC) return;
  if(myPlayer){const tx=myPlayer.x-CW/2,ty=myPlayer.y-CH/2;camX+=(tx-camX)*0.12;camY+=(ty-camY)*0.12;}
  camX=Math.max(0,Math.min(WPX-CW,camX));camY=Math.max(0,Math.min(WPY-CH,camY));
  const cx=Math.floor(camX),cy=Math.floor(camY);
  ctx2.drawImage(offC,-cx,-cy);
  drawTorches(cx,cy);
  ctx2.save();ctx2.translate(-cx,-cy);
  Object.values(players).sort((a,b)=>a.y-b.y).forEach(p=>{if(p)drawPlayer(p);});
  drawParticles();drawDNums(cx,cy);drawEmotes(cx,cy);
  ctx2.restore();
  drawMinimap();
}

function drawTorches(cx,cy){
  const t=Date.now()/300;
  const tx0=Math.floor(cx/TS),ty0=Math.floor(cy/TS);
  const tx1=Math.min(TW-1,tx0+Math.ceil(CW/TS)+1),ty1=Math.min(TH-1,ty0+Math.ceil(CH/TS)+1);
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    if(decorMap[ty*TW+tx]!=='torch') continue;
    const px=tx*TS-cx,py=ty*TS-cy,fl=Math.sin(t+tx*0.7+ty*1.3)*2;
    const r=ctx2.createRadialGradient(px+8,py+8,2,px+8,py+8,28);
    r.addColorStop(0,'#ffaa0030');r.addColorStop(1,'transparent');
    ctx2.fillStyle=r;ctx2.beginPath();ctx2.arc(px+8,py+8,28,0,Math.PI*2);ctx2.fill();
    ctx2.fillStyle=`rgba(255,${160+Math.sin(t+tx)*40|0},0,0.9)`;ctx2.fillRect(px+6,py+2+fl,4,4);
    ctx2.fillStyle='#ffff80cc';ctx2.fillRect(px+7,py+1+fl,2,3);
  }
}

function drawPlayer(p){
  const step=p.step||0,alive=p.alive!==false,isMe=p.id===myId;
  ctx2.save();ctx2.globalAlpha=alive?1:0.25;
  // Shadow
  ctx2.fillStyle='#00000045';ctx2.beginPath();ctx2.ellipse(p.x,p.y+2,9,5,0,0,Math.PI*2);ctx2.fill();
  if(step<1){
    // Ghost
    ctx2.globalAlpha*=(0.3+Math.sin(Date.now()/600)*0.1);
    ctx2.fillStyle='#aaaaff88';ctx2.beginPath();ctx2.arc(p.x,p.y-6,10,0,Math.PI*2);ctx2.fill();
    ctx2.globalAlpha=alive?1:0.25;
  } else {
    const col=p.color||'#8888ff',f=p.facing||1;
    // Body
    const bg=ctx2.createRadialGradient(p.x,p.y-4,1,p.x,p.y-4,10);
    bg.addColorStop(0,lighten(col,40));bg.addColorStop(1,col);
    ctx2.fillStyle=bg;ctx2.beginPath();ctx2.ellipse(p.x,p.y-4,9,11,0,0,Math.PI*2);ctx2.fill();
    // Shine
    ctx2.fillStyle='#ffffff22';ctx2.beginPath();ctx2.ellipse(p.x-2,p.y-6,4,5,0,0,Math.PI*2);ctx2.fill();
    // Head
    ctx2.fillStyle='#ffddaa';ctx2.beginPath();ctx2.arc(p.x,p.y-13,5,0,Math.PI*2);ctx2.fill();
    // Helmet
    ctx2.fillStyle=darken(col,20);ctx2.beginPath();ctx2.arc(p.x,p.y-14,5,Math.PI,0);ctx2.fill();
    // Weapon
    if(step>=3){
      ctx2.strokeStyle='#c8c8c8';ctx2.lineWidth=2;
      ctx2.save();ctx2.translate(p.x+f*8,p.y-8);ctx2.rotate(p.attacking?f*0.4:0);
      ctx2.beginPath();ctx2.moveTo(0,-8);ctx2.lineTo(0,4);ctx2.stroke();
      ctx2.strokeStyle='#8a6020';ctx2.lineWidth=3;ctx2.beginPath();ctx2.moveTo(-3,0);ctx2.lineTo(3,0);ctx2.stroke();
      ctx2.restore();
    }
    // Attack ring
    if(p.attacking){ctx2.strokeStyle=col+'88';ctx2.lineWidth=2;ctx2.beginPath();ctx2.arc(p.x,p.y-4,22,0,Math.PI*2);ctx2.stroke();}
    // Aura step5
    if(step>=5){const t=Date.now()/800;ctx2.strokeStyle=col;ctx2.lineWidth=1.5;ctx2.globalAlpha*=0.4;ctx2.beginPath();ctx2.arc(p.x,p.y-4,18+Math.sin(t)*3,0,Math.PI*2);ctx2.stroke();ctx2.globalAlpha=alive?1:0.25;}
  }
  // Nametag
  const tag=(isMe?'★ ':'')+p.name;
  ctx2.font=`bold ${isMe?11:9}px Fira Code`;
  ctx2.textAlign='center';
  const tw=ctx2.measureText(tag).width;
  ctx2.fillStyle='#000000b0';ctx2.fillRect(p.x-tw/2-3,p.y-30,tw+6,13);
  ctx2.fillStyle=isMe?'#e8c84a':'#c8d0f0';ctx2.fillText(tag,p.x,p.y-20);
  // HP bar step2+
  if(step>=2&&p.maxHp){
    const bw=34,bx=p.x-17,by=p.y-36;
    ctx2.fillStyle='#3a0000';ctx2.fillRect(bx,by,bw,4);
    const pct=Math.max(0,p.hp/p.maxHp);
    ctx2.fillStyle=pct>0.5?'#44dd44':pct>0.25?'#ddaa22':'#dd2222';ctx2.fillRect(bx,by,bw*pct,4);
  }
  ctx2.textAlign='left';ctx2.restore();
}

function drawParticles(){particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.t--;ctx2.globalAlpha=p.t/p.max;ctx2.fillStyle=p.c;ctx2.beginPath();ctx2.arc(p.x,p.y,p.r,0,Math.PI*2);ctx2.fill();ctx2.globalAlpha=1;return p.t>0;});}
function spawnFx(x,y,f){for(let i=0;i<14;i++) particles.push({x:x+(f||1)*12,y:y-4,vx:(Math.random()-.3)*5*(f||1),vy:(Math.random()-.5)*4,r:Math.random()*3+1,c:`hsl(${Math.random()*30+5},100%,${55+Math.random()*20}%)`,t:30,max:30});}
function drawDNums(cx,cy){dmgNums=dmgNums.filter(d=>{d.t--;d.y-=0.6;ctx2.globalAlpha=d.t/70;ctx2.font='bold 9px Press Start 2P';ctx2.fillStyle='#ff3333';ctx2.textAlign='center';ctx2.fillText('-'+d.val,d.x-cx,d.y-cy);ctx2.textAlign='left';ctx2.globalAlpha=1;return d.t>0;});}
function drawEmotes(cx,cy){emotes=emotes.filter(e=>{const p=players[e.id];if(!p)return false;e.t--;ctx2.globalAlpha=Math.min(1,e.t/30);ctx2.font='11px Fira Code';const w=ctx2.measureText(e.msg).width;ctx2.fillStyle='#000000cc';ctx2.fillRect(p.x-cx-w/2-4,p.y-cy-48,w+8,16);ctx2.fillStyle='#dde0ff';ctx2.textAlign='center';ctx2.fillText(e.msg,p.x-cx,p.y-cy-35);ctx2.textAlign='left';ctx2.globalAlpha=1;return e.t>0;});}

/* ── UI ───────────────────────────────────────────────────── */
function updateHUD(){
  if(!myPlayer) return;
  document.getElementById('hpn').textContent=`${myPlayer.name} [${myPlayer.className||'?'}]`;
  const hp=myPlayer.hp||0,mhp=myPlayer.maxHp||100;
  document.getElementById('hhb').style.width=(hp/mhp*100)+'%';
  document.getElementById('hhv').textContent=`${hp}/${mhp}`;
  const xp=myPlayer.xp||0;
  document.getElementById('hxb').style.width=Math.min(xp/500*100,100)+'%';
  document.getElementById('hxv').textContent=xp;
  document.getElementById('hlv').textContent=Math.floor(xp/100)+1;
  document.getElementById('hst').textContent=`${myPlayer.step||0}/5`;
  updateStepBadge();
}
function updateStepBadge(){const st=myPlayer?.step||0;document.getElementById('spv').textContent='█'.repeat(st)+'░'.repeat(5-st);}
function updateOL(){document.getElementById('oc').textContent=Object.keys(players).length;}
function updatePL(){
  document.getElementById('pli').innerHTML=Object.values(players).map(p=>`<div class="pli"><div class="pld" style="background:${p.color||'#8888ff'}"></div><span style="color:${p.id===myId?'var(--accent)':'var(--text)'};font-size:13px">${p.name}</span><span class="plx">${p.xp||0}xp</span></div>`).join('');
  updateOL();
}
function updatePooChecks(c){[[0,c.heranca],[1,c.encapsulamento],[2,c.encapsulamentoPrivate],[3,c.polimorfismoMover],[4,c.polimorfismoAtacar],[5,c.interface]].forEach(([i,v])=>{document.getElementById('pc'+i)?.classList.toggle('on',!!v);});}
function showFB(type,msg){const f=document.getElementById('fb');if(!f)return;f.className=type;f.style.display='block';f.innerHTML=msg;f.scrollIntoView({behavior:'smooth',block:'nearest'});}
function addFeed(msg,cls){const f=document.getElementById('feed');const el=document.createElement('div');el.className=`fi ${cls}`;el.textContent=msg;f.appendChild(el);while(f.children.length>7)f.removeChild(f.firstChild);setTimeout(()=>el.remove(),4500);}
function flashEl(){const f=document.getElementById('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),800);}
function showXPN(xp){const w=document.getElementById('cwrap');const el=document.createElement('div');el.className='xpn';el.textContent='+'+xp+' XP!';el.style.left=(w.clientWidth/2-30)+'px';el.style.top=(w.clientHeight/2-40)+'px';w.appendChild(el);setTimeout(()=>el.remove(),1500);}
function setDis(id,v){const e=document.getElementById(id);if(e)v?e.setAttribute('disabled',''):e.removeAttribute('disabled');}
function setCST(t,c){const e=document.getElementById('cst');if(e){e.textContent=t;e.style.color=c;}}
function edKey(e){if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2;}if(e.ctrlKey&&e.key==='Enter')submitCode();}
function insertChip(code){const ed=document.getElementById('ced');if(!ed)return;const li=ed.value.lastIndexOf('}');li<0?ed.value+='\n'+code:ed.value=ed.value.slice(0,li)+'    '+code+'\n'+ed.value.slice(li);ed.focus();}
function insertColor(c,el){const ed=document.getElementById('ced');if(!ed)return;/val cor.*=.*"[^"]*"/.test(ed.value)?ed.value=ed.value.replace(/val cor.*:\s*String\s*=\s*"[^"]*"/,`val cor: String = "${c}"`):insertChip(`val cor: String = "${c}"`);document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));el.classList.add('on');}
function setA(attr,val,el){const span=document.getElementById('cv-'+attr);if(span)span.textContent=val;const ed=document.getElementById('ced');if(!ed)return;const type=attr==='velocidade'||attr==='hp'?'var':'val';ed.value=ed.value.replace(new RegExp(`(val|var)\\s+${attr}\\s*:\\s*Int\\s*=\\s*\\d+`,'g'),`${type} ${attr}: Int = ${val}`);}
function setTpl(){const ed=document.getElementById('ced');if(ed)ed.value=STEPS[currentStep].template;}
function showHint(){showFB('warn','Veja o bloco "✏️ VOCÊ ESCREVE" acima e copie a estrutura!');}
function goStep(n){if(n>0&&n>(myPlayer?.step||0))return;currentStep=n;renderStep(n);renderPills();}
function submitCode(){
  const code=document.getElementById('ced')?.value||'';
  if(!socket){showFB('err','Conecte-se ao servidor primeiro!');return;}
  if(!code.trim()){showFB('err','O editor está vazio!');return;}
  const b=document.getElementById('bsub');b.disabled=true;b.textContent='⏳ Validando...';
  socket.emit('submit_code',{code,playerName});
  setTimeout(()=>{const b=document.getElementById('bsub');if(b){b.disabled=false;b.textContent=`▶ VALIDAR CÓDIGO & ENTRAR NO REINO (+${STEPS[currentStep]?.xp||50} XP)`;}},1800);
}
function darken(hex,a=30){if(!hex||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);return'#'+[((n>>16)&255)-a,((n>>8)&255)-a,(n&255)-a].map(v=>'0'+Math.max(0,v).toString(16)).map(s=>s.slice(-2)).join('');}
function lighten(hex,a=30){if(!hex||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);return'#'+[((n>>16)&255)+a,((n>>8)&255)+a,(n&255)+a].map(v=>'0'+Math.min(255,v).toString(16)).map(s=>s.slice(-2)).join('');}
</script>
